<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}现场考核管理平台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-clipboard2-data"></i>
                <span>考核管理平台</span>
            </div>
            <ul class="sidebar-nav">
                <li class="{% if request.path == '/' %}active{% endif %}">
                    <a href="/"><i class="bi bi-speedometer2"></i><span>数据仪表盘</span></a>
                </li>
                <li class="{% if request.path.startswith('/sites') %}active{% endif %}">
                    <a href="/sites"><i class="bi bi-geo-alt"></i><span>考核地点</span></a>
                </li>
                <li class="{% if request.path.startswith('/criteria') %}active{% endif %}">
                    <a href="/criteria"><i class="bi bi-list-check"></i><span>考核标准</span></a>
                </li>
                <li class="{% if request.path.startswith('/inspections') %}active{% endif %}">
                    <a href="/inspections"><i class="bi bi-journal-text"></i><span>考核记录</span></a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <small>&copy; 2026 考核管理平台</small>
            </div>
        </nav>

        <!-- Main Content -->
        <div id="main-content" class="main-content">
            <header class="top-bar">
                <button class="btn btn-link sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <div class="top-bar-title">
                    <h5 class="mb-0">{% block page_title %}仪表盘{% endblock %}</h5>
                </div>
                <div class="top-bar-actions">
                    <span class="text-muted me-3"><i class="bi bi-calendar3"></i> <span id="current-date"></span></span>
                </div>
            </header>
            <main class="content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999">
        <div id="appToast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
